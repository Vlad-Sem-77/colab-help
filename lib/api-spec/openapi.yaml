openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Notebook reading, AI-provider catalog, and Colab bridge API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: colab
    description: Colab connection and execution
  - name: ai
    description: Direct AI-provider catalogs and notebook analysis
  - name: history
    description: Experiment history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /colab/ping:
    post:
      operationId: pingColab
      tags: [colab]
      summary: Check Colab connection
      description: Pings the Colab Flask server to verify it is reachable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColabUrlInput"
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColabPingResult"
        "400":
          description: Bad request

  /colab/models:
    post:
      operationId: fetchFreeModels
      tags: [colab]
      summary: Fetch list of free models from Colab
      description: Asks the Colab server to fetch free models from OpenRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColabUrlInput"
      responses:
        "200":
          description: List of free models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeModelsResult"
        "400":
          description: Bad request

  /colab/run:
    post:
      operationId: runExperiment
      tags: [colab]
      summary: Run an experiment via Colab
      description: Sends a generation task to the Colab Flask server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentInput"
      responses:
        "200":
          description: Experiment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResult"
        "400":
          description: Bad request
        "502":
          description: Colab server error

  /colab/analyze-notebook:
    post:
      operationId: analyzeNotebook
      tags: [colab]
      summary: Answer a question about an uploaded notebook
      description: Sends notebook text to the connected Colab model for analysis without executing notebook cells or adding the prompt to experiment history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookAnalysisInput"
      responses:
        "200":
          description: Notebook analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookAnalysisResult"
        "400":
          description: Bad request
        "502":
          description: Colab server error

  /ai/providers:
    get:
      operationId: listAiProviders
      tags: [ai]
      summary: List supported AI providers
      description: Returns provider model-catalog requirements, current browser-session connection status, and documented voice capabilities without exposing credentials
      security:
        - {}
        - AiSessionCookie: []
      responses:
        "200":
          description: Supported providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProvidersResult"

  /ai/models:
    get:
      operationId: listAiModels
      tags: [ai]
      summary: List models from a provider catalog
      parameters:
        - name: providerId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AiProviderId"
      security:
        - {}
        - {}
        - AiSessionCookie: []
      responses:
        "200":
          description: Provider models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelsResult"
        "400":
          description: Unsupported provider
        "409":
          description: A session key is required for this catalog
        "502":
          description: Provider catalog is unavailable

  /ai/analyze-notebook:
    post:
      operationId: analyzeNotebookWithAi
      tags: [ai]
      summary: Analyze notebook content with a selected provider model
      description: Uses the server-side browser session credential to send notebook text to the selected AI provider; notebook cells are not executed
      security:
        - AiSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiNotebookAnalysisInput"
      responses:
        "200":
          description: Notebook analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiNotebookAnalysisResult"
        "400":
          description: Invalid request
        "409":
          description: Session key is missing or model is unavailable
        "502":
          description: Provider request failed

  /ai/explain-notebook-cells:
    post:
      operationId: explainNotebookCellsWithAi
      tags: [ai]
      summary: Generate explanations for notebook cells with a selected provider model
      description: Sends notebook text to the selected provider only after explicit user consent; cell code is never executed
      security:
        - AiSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCellExplanationsInput"
      responses:
        "200":
          description: Generated cell explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCellExplanationsResult"
        "400":
          description: Invalid request
        "409":
          description: Session key is missing or model is unavailable
        "502":
          description: Provider request failed or returned invalid explanations

  /ai/credentials/connect:
    post:
      operationId: connectAiCredential
      tags: [ai]
      summary: Verify and connect a provider key for this browser session
      description: Verifies the key against the provider model catalog and stores it only in server memory for up to 12 hours
      security:
        - {}
        - AiSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiCredentialConnectInput"
      responses:
        "200":
          description: The provider key was verified and connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCredentialConnectResult"
        "400":
          description: Invalid request
        "502":
          description: Provider rejected the key or its catalog is unavailable

  /ai/credentials/{providerId}:
    delete:
      operationId: disconnectAiCredential
      tags: [ai]
      summary: Remove a provider key from this browser session
      security:
        - AiSessionCookie: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AiProviderId"
      responses:
        "204":
          description: Provider key removed from the session
        "400":
          description: Unsupported provider

  /ai/voice/transcribe:
    post:
      operationId: transcribeAiVoice
      tags: [ai]
      summary: Transcribe a short voice question
      description: Sends one in-memory audio recording to the selected provider using the configured transcription model
      security:
        - AiSessionCookie: []
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
      parameters:
        - name: providerId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AiProviderId"
      responses:
        "200":
          description: Transcribed voice question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiVoiceTranscriptionResult"
        "400":
          description: Unsupported or empty audio
        "409":
          description: Provider key is not connected
        "413":
          description: Audio recording exceeds the size limit
        "502":
          description: Provider transcription failed

  /ai/voice/speech:
    post:
      operationId: synthesizeAiSpeech
      tags: [ai]
      summary: Speak an AI answer
      description: Converts answer text to audio with the selected provider's configured speech model
      security:
        - AiSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiVoiceSpeechInput"
      responses:
        "200":
          description: Generated speech audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
        "409":
          description: Provider key is not connected
        "502":
          description: Provider speech synthesis failed

  /history:
    get:
      operationId: listHistory
      tags: [history]
      summary: Get experiment history
      description: Returns the list of recent experiments
      responses:
        "200":
          description: List of history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
    delete:
      operationId: clearHistory
      tags: [history]
      summary: Clear experiment history
      description: Deletes all experiment history
      responses:
        "204":
          description: History cleared

  /history/{id}:
    delete:
      operationId: deleteHistoryEntry
      tags: [history]
      summary: Delete a history entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entry deleted
        "404":
          description: Entry not found

components:
  securitySchemes:
    AiSessionCookie:
      type: apiKey
      in: cookie
      name: notebook.sid
      description: HttpOnly cookie identifying the server-side provider-key session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ColabUrlInput:
      type: object
      required: [colabUrl]
      properties:
        colabUrl:
          type: string
          description: ngrok URL of the Colab Flask server

    ColabPingResult:
      type: object
      required: [online, message]
      properties:
        online:
          type: boolean
        message:
          type: string

    FreeModel:
      type: object
      required: [id, name, contextLength]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        contextLength:
          type: integer
        topProvider:
          type: ["string", "null"]
        averageRating:
          type: ["number", "null"]

    FreeModelsResult:
      type: object
      required: [models, count]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/FreeModel"
        count:
          type: integer

    ExperimentInput:
      type: object
      required: [colabUrl, taskType, mode, params]
      properties:
        colabUrl:
          type: string
        taskType:
          type: string
          enum: [text_generation, model_comparison, system_prompt, custom_code]
        mode:
          type: string
          enum: [auto, manual]
        model:
          type: ["string", "null"]
        models:
          type: array
          items:
            type: string
        params:
          $ref: "#/components/schemas/ExperimentParams"

    ExperimentParams:
      type: object
      required: [prompt, temperature, maxTokens]
      properties:
        prompt:
          type: string
        temperature:
          type: number
        maxTokens:
          type: integer
        systemPrompt:
          type: ["string", "null"]
        customCode:
          type: ["string", "null"]

    NotebookAnalysisInput:
      type: object
      required: [colabUrl, notebookContext, question]
      properties:
        colabUrl:
          type: string
          format: uri
          maxLength: 2048
        notebookContext:
          type: string
          minLength: 1
          maxLength: 32000
        question:
          type: string
          minLength: 1
          maxLength: 12000

    NotebookAnalysisResult:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        model:
          type: ["string", "null"]
        sources:
          type: array
          description: Zero-based cell indexes cited by the model and present in the supplied notebook context
          items:
            type: integer
            minimum: 0

    AiProviderId:
      type: string
      enum: [aitunnel, proxyapi, routerai, openai]

    AiProvider:
      type: object
      required: [id, name, catalogRequiresKey, hasSessionKey, voiceInputAvailable, voiceOutputAvailable, transcriptionModelId, speechModelId]
      properties:
        id:
          $ref: "#/components/schemas/AiProviderId"
        name:
          type: string
        catalogRequiresKey:
          type: boolean
          description: Whether the provider requires a session key just to list models
        hasSessionKey:
          type: boolean
          description: Whether this browser session has a verified provider key
        voiceInputAvailable:
          type: boolean
          description: Whether a documented transcription model and endpoint are configured
        voiceOutputAvailable:
          type: boolean
          description: Whether a documented speech model and endpoint are configured
        transcriptionModelId:
          type: ["string", "null"]
        speechModelId:
          type: ["string", "null"]

    AiProvidersResult:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AiProvider"

    AiModel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        ownedBy:
          type: ["string", "null"]
        contextLength:
          type: ["integer", "null"]
        inputPricePerMillion:
          type: ["number", "null"]
        outputPricePerMillion:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]

    AiModelsResult:
      type: object
      required: [providerId, models, count]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        models:
          type: array
          items:
            $ref: "#/components/schemas/AiModel"
        count:
          type: integer

    AiNotebookAnalysisInput:
      type: object
      required: [providerId, modelId, profile, notebookContext, question]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        modelId:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          type: string
          enum: [review, economy]
        notebookContext:
          type: string
          minLength: 1
          maxLength: 32000
        question:
          type: string
          minLength: 1
          maxLength: 12000

    AiNotebookAnalysisResult:
      type: object
      required: [answer, providerId, modelId, sources]
      properties:
        answer:
          type: string
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        modelId:
          type: string
        sources:
          type: array
          description: Zero-based cell indexes cited by the model and present in the supplied notebook context
          items:
            type: integer
            minimum: 0

    AiCellExplanationsInput:
      type: object
      required: [providerId, modelId, profile, notebookContext]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        modelId:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          type: string
          enum: [review, economy]
        notebookContext:
          type: string
          minLength: 1
          maxLength: 32000

    AiCellExplanation:
      type: object
      required: [cellIndex, explanation]
      properties:
        cellIndex:
          type: integer
          minimum: 0
        explanation:
          type: string
          minLength: 1
          maxLength: 1600

    AiCellExplanationsResult:
      type: object
      required: [providerId, modelId, explanations]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        modelId:
          type: string
        explanations:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AiCellExplanation"

    AiCredentialConnectInput:
      type: object
      required: [providerId, apiKey]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        apiKey:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true

    AiCredentialConnectResult:
      type: object
      required: [providerId, connected]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        connected:
          type: boolean

    AiVoiceTranscriptionResult:
      type: object
      required: [text]
      properties:
        text:
          type: string

    AiVoiceSpeechInput:
      type: object
      required: [providerId, text]
      properties:
        providerId:
          $ref: "#/components/schemas/AiProviderId"
        text:
          type: string
          minLength: 1
          maxLength: 6000

    ModelCard:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        topProvider:
          type: ["string", "null"]
        contextLength:
          type: ["integer", "null"]
        averageRating:
          type: ["number", "null"]
        description:
          type: ["string", "null"]

    ExperimentMetrics:
      type: object
      required: [promptTokens, completionTokens, totalTokens, executionTime]
      properties:
        promptTokens:
          type: integer
        completionTokens:
          type: integer
        totalTokens:
          type: integer
        executionTime:
          type: number

    ComparisonItem:
      type: object
      required: [modelId, result, metrics]
      properties:
        modelId:
          type: string
        result:
          type: string
        metrics:
          $ref: "#/components/schemas/ExperimentMetrics"
        error:
          type: ["string", "null"]

    ExperimentResult:
      type: object
      required: [status, taskType, mode]
      properties:
        status:
          type: string
          enum: [ok, error]
        taskType:
          type: string
        mode:
          type: string
        result:
          type: ["string", "null"]
        modelCard:
          $ref: "#/components/schemas/ModelCard"
        metrics:
          $ref: "#/components/schemas/ExperimentMetrics"
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonItem"
        error:
          type: ["string", "null"]

    HistoryEntry:
      type: object
      required: [id, taskType, mode, createdAt]
      properties:
        id:
          type: integer
        taskType:
          type: string
        mode:
          type: string
        model:
          type: ["string", "null"]
        prompt:
          type: string
        result:
          type: ["string", "null"]
        promptTokens:
          type: ["integer", "null"]
        completionTokens:
          type: ["integer", "null"]
        totalTokens:
          type: ["integer", "null"]
        executionTime:
          type: ["number", "null"]
        modelName:
          type: ["string", "null"]
        modelProvider:
          type: ["string", "null"]
        modelContextLength:
          type: ["integer", "null"]
        createdAt:
          type: string
